name: Android APK

on:
  push:
    branches: [ android-port, android-spaghettikart-runtime ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spaghettikart-runtime:
    if: github.ref == 'refs/heads/android-spaghettikart-runtime'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MK64 integration branch
        uses: actions/checkout@v4

      - name: Checkout pinned Android runtime source
        run: |
          git clone https://github.com/izzy2lost/SpaghettiKart.git runtime
          cd runtime
          git checkout 9253aad869c96a8e660f707a74fe57c5d4ebdd2a
          git submodule update --init torch libultraship tools/blender/fast64

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize Android SDK (avoid obsolete legacy tools package)
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.15729638" "cmake;3.30.3"

      - name: Install host build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc g++ git cmake ninja-build lsb-release

      - name: Build Torch host extractor
        working-directory: runtime
        run: |
          set -o pipefail
          cmake -S torch -B torch/build-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_STANDALONE=ON \
            -DBUILD_MK64=ON \
            -DBUILD_NAUDIO=ON \
            -DBUILD_SM64=OFF \
            -DBUILD_SF64=OFF \
            -DBUILD_FZERO=OFF \
            -DBUILD_MARIO_ARTIST=OFF 2>&1 | tee ../torch-configure.log
          cmake --build torch/build-host --parallel 2>&1 | tee ../torch-build.log

      - name: Generate engine assets
        working-directory: runtime
        run: |
          torch/build-host/torch pack assets spaghetti.o2r o2r
          cp spaghetti.o2r android/app/src/main/assets/spaghetti.o2r
          # Gradle's stageTorchAssets task is not attached to mergeDebugAssets
          # in this pinned upstream revision. Include ROM extraction recipes
          # explicitly so the APK can unpack a user-selected ROM.
          cp config.yml android/app/src/main/assets/config.yml
          cp -a yamls android/app/src/main/assets/yamls
          cp -a meta android/app/src/main/assets/meta
          test -f android/app/src/main/assets/yamls/mk64.yaml || find android/app/src/main/assets/yamls -type f | head

      - name: Build runtime debug APK
        working-directory: runtime/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../../gradle-build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../../mk64-runtime-debug.apk
          unzip -Z1 ../../mk64-runtime-debug.apk | grep -qx 'assets/config.yml'
          unzip -Z1 ../../mk64-runtime-debug.apk | grep -q '^assets/yamls/'
          unzip -Z1 ../../mk64-runtime-debug.apk | grep -q '^assets/meta/'
          unzip -Z1 ../../mk64-runtime-debug.apk | grep -qx 'assets/spaghetti.o2r'

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mk64-runtime-build-logs
          path: |
            torch-configure.log
            torch-build.log
            gradle-build.log
          if-no-files-found: ignore

      - name: Upload runtime debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mk64-spaghettikart-runtime-debug
          path: mk64-runtime-debug.apk

  direct-port:
    if: github.ref != 'refs/heads/android-spaghettikart-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: bash tools/android/build_android.sh
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mk64-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
