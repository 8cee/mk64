name: Update Mod Registry

on:
  workflow_dispatch:
  push:
    branches: [ android-spaghettikart-runtime ]
    paths:
      - 'mods/server-config.json'
      - 'tools/mod_registry/update_gamebanana_registry.py'
      - '.github/workflows/update-mod-registry.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-spaghettikart-runtime

      - name: Generate registry from GameBanana
        run: python3 tools/mod_registry/update_gamebanana_registry.py

      - name: Commit registry if changed
        run: |
          if git diff --quiet -- mods/registry.json; then
            echo "Registry unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/registry.json
          git commit -m "mods: refresh remote registry"
          git push origin HEAD:android-spaghettikart-runtime
